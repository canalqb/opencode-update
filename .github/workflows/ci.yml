name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell syntax (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $files = @('install.ps1','opencode-update.ps1','uninstall.ps1')
          $failed = $false
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Host ("ERROR in {0} line {1}: {2}" -f $f, $_.Extent.StartLineNumber, $_.Message) }
            } else {
              Write-Host ("OK: {0}" -f $f)
            }
          }
          if ($failed) { exit 1 }

      - name: Validate PowerShell syntax (PowerShell 7)
        shell: pwsh
        run: |
          $files = @('install.ps1','opencode-update.ps1','uninstall.ps1')
          $failed = $false
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Host ("ERROR in {0} line {1}: {2}" -f $f, $_.Extent.StartLineNumber, $_.Message) }
            } else {
              Write-Host ("OK: {0}" -f $f)
            }
          }
          if ($failed) { exit 1 }

      - name: Validate models template and recommended lists consistency
        shell: pwsh
        run: |
          $tpl = [System.IO.File]::ReadAllText((Resolve-Path './models-template.jsonc').Path).TrimStart([char]0xFEFF)
          $noComments = (($tpl -split "`r?`n") | Where-Object { $_ -notmatch '^\s*//' }) -join "`n"
          $json = $noComments | ConvertFrom-Json
          $tplModels = @($json.provider.nvidia.models.PSObject.Properties.Name)
          if ($tplModels.Count -ne 26) { Write-Host ("template has {0} models, expected 26" -f $tplModels.Count); exit 1 }
          foreach ($f in @('install.ps1','opencode-update.ps1')) {
            $txt = [System.IO.File]::ReadAllText((Resolve-Path $f).Path)
            $m = [regex]::Match($txt, '(?s)\$Script:RecommendedModels\s*=\s*@\((.*?)\)\s*\r?\n')
            if (-not $m.Success) { Write-Host ("$f does not define `$Script:RecommendedModels"); exit 1 }
            $ids = [regex]::Matches($m.Groups[1].Value, "'([^']+)'") | ForEach-Object { $_.Groups[1].Value }
            if ($ids.Count -ne 26) { Write-Host ("{0} has {1} recommended ids, expected 26" -f $f, $ids.Count); exit 1 }
            $diff = Compare-Object $ids $tplModels
            if ($diff) { Write-Host ("{0} recommended list differs from models-template.jsonc" -f $f); $diff | Format-Table; exit 1 }
            Write-Host ("OK: {0} - 26 models consistent with template" -f $f)
          }

      - name: Updater check-mode smoke test (PowerShell 7)
        shell: pwsh
        run: |
          # -Check must always complete gracefully with a RESULT line, on any machine.
          $out = & pwsh -NoProfile -File ./opencode-update.ps1 -Check 2>&1 | Out-String
          Write-Host $out
          if (-not $out) { Write-Host 'Updater produced no output'; exit 1 }
          if ($out -notmatch 'RESULT: (SUCCESS|FAILED)') { Write-Host 'Updater did not complete gracefully'; exit 1 }
          Write-Host 'Updater smoke test OK (check mode completed).'
          # explicit exit: pwsh inherits $LASTEXITCODE from the child updater otherwise
          exit 0
